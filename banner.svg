  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect y="256" width="1200" height="4" fill="url(#accent)"/>

  <text x="60" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">Jonathan Molina González</text>
  <text x="60" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Backend / Fullstack Engineer</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g>
