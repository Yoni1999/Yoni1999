      <text x="104" y="196" fill="#79c0ff" text-anchor="middle">Node.js</text>
    </g>
    <g>
      <rect x="158" y="176" width="80" height="30" rx="15" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="1"/>
      <text x="198" y="196" fill="#7ee787" text-anchor="middle">NestJS</text>
    </g>
    <g>
