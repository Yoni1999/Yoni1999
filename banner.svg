  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#8b949e">
    <text x="820" y="80">{</text>
    <text x="840" y="105">role: <tspan fill="#a5d6ff">"backend"</tspan>,</text>
    <text x="840" y="130">stack: [<tspan fill="#a5d6ff">"node"</tspan>, <tspan fill="#a5d6ff">"kafka"</tspan>],</text>
    <text x="840" y="155">integrations: [<tspan fill="#a5d6ff">"sap"</tspan>, <tspan fill="#a5d6ff">"vtex"</tspan>]</text>
